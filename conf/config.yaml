defaults:
  - _self_
dataset:
  dataroot: ../data
  part: 1
  nidentities: 750
  imagesperidentity: 90
  candidatesperidentity: 100
  # forget_pct × nidentities = forget identities, distributed across
  # forget_steps steps (uniform with remainder in first steps).
  #   nidentities=750 → nforget=75 → 15 steps × 5 ids
  #   nidentities=600 → nforget=60 → 15 steps × 4 ids
  #   nidentities=400 → nforget=40 → 15 steps: 10×3 + 5×2
  # Minimum: nidentities ≥ 100, forget_steps ≥ 5.
  forget_pct: 0.10
  forget_steps: 15
  # fraction of each identity's images reserved for MUFAC holdout evaluation
  holdout_frac: 0.20
  # floor — thin datasets never get probe‑breaking holdouts
  min_holdout: 5
  # forget schedules (balanced ships BOTH as columns): `forget_step`
  # uniform baseline (step index == cumulative count) and
  # `forget_step_poisson` seeded arrival-model stress test
  # (arXiv:2507.15280, arXiv:2012.01668; evaluate by cumulative count).
  seed: 42
  # skip Kaggle download when dataset already exists locally
  skip_download: false
pipeline:
  ctxid: 0
  imgsize: 224
  confthreshold: 0.85
  blurthreshold: 80.0
  min_similarity_raw: 0.40
  min_similarity_final: 0.45
  instantid:
    base_model: RunDiffusion/Juggernaut-XL-v9
    width: 1024
    height: 1024
    # guidance_scale, ip_adapter_scale, and num_inference_steps are
    # resolved from MODEL_DEFAULTS in generate_identities.py based on
    # the selected base_model.  Override via CLI to bypass presets:
    #   pipeline.instantid.guidance_scale=4.0
    controlnet_conditioning_scale: 0.80
    cache_dir: null
    require_cuda: true

steps:
  download: false
  generate: true
  preprocess: true
  extract: true
  build: true
