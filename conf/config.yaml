defaults:
  - _self_
dataset:
  dataroot: ../data
  part: 1
  nidentities: 400
  imagesperidentity: 75
  candidatesperidentity: 85
  # forget_steps × 2 = forget identities (20 steps → 40 ids).
  # test_pct × nidentities = test identities.
  # retain = nidentities - forget - test.
  forget_steps: 20
  test_pct: 0.15
  seed: 42
  # number of images to evaluate for CLIP+KMeans diverse selection
  pool_size: 4000
pipeline:
  ctxid: 0
  imgsize: 128
  confthreshold: 0.85
  blurthreshold: 80.0
  min_similarity_raw: 0.40
  min_similarity_final: 0.45
  instantid:
    base_model: RunDiffusion/Juggernaut-XL-v9
    width: 1024
    height: 1024
    # guidance_scale, ip_adapter_scale, and num_inference_steps are
    # resolved from MODEL_DEFAULTS in generate_identities.py based on
    # the selected base_model.  Override via CLI to bypass presets:
    #   pipeline.instantid.guidance_scale=4.0
    controlnet_conditioning_scale: 0.80
    cache_dir: null
    require_cuda: true

steps:
  download: false
  generate: true
  preprocess: true
  extract: true
  build: true
