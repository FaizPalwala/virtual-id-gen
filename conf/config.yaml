defaults:
  - _self_
dataset:
  dataroot: ../data
  part: 1
  nidentities: 400
  imagesperidentity: 75
  candidatesperidentity: 85
  nforget: 40
  ntest: 60
  seed: 42
  # null means consider all shuffled raw sources until target is reached
  max_seed_attempts: null
pipeline:
  ctxid: 0
  imgsize: 128
  confthreshold: 0.85
  blurthreshold: 80.0
  min_similarity_raw: 0.40
  min_similarity_final: 0.45
  instantid:
    base_model: stabilityai/stable-diffusion-xl-base-1.0
    width: 1024
    height: 1024
    num_inference_steps: 30
    guidance_scale: 3.0
    ip_adapter_scale: 0.85
    controlnet_conditioning_scale: 0.80
    cache_dir: null
    require_cuda: true
    age_stratify: false

steps:
  download: false
  generate: true
  preprocess: true
  extract: true
  build: true
