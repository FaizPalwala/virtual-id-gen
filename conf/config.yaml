defaults:
  - _self_
dataset:
  dataroot: ../data
  part: 1
  nidentities: 750
  imagesperidentity: 90
  candidatesperidentity: 100
  # forget_pct × nidentities = forget identities, distributed across
  # forget_steps steps (uniform with remainder in first steps).
  #   nidentities=750 → nforget=75 → 15 steps × 5 ids
  #   nidentities=600 → nforget=60 → 15 steps × 4 ids
  #   nidentities=400 → nforget=40 → 15 steps: 10×3 + 5×2
  # Minimum: nidentities ≥ 100, forget_steps ≥ 5.
  forget_pct: 0.10
  forget_steps: 15
  # fraction of each identity's images reserved for MUFAC holdout evaluation
  holdout_frac: 0.20
  # floor — thin datasets never get probe‑breaking holdouts
  min_holdout: 5
  seed: 42
  # skip Kaggle download when dataset already exists locally
  skip_download: false
  # In-place raw JPEG conversion (RELEASE_TODO Phase D2 P1-4): when set
  # (any non-null value — enable flag), the raw build converts every
  # shipped candidate PNG→JPEG q95 (4:4:4) IN PLACE with verify-then-delete
  # (build_dataset._convert_candidates_inplace), so the off-node transfer
  # bundle is ~22 GB not ~100 GB of PNG and the CSV image_path ships .jpg.
  # Null = off (PNG source tree kept, Mac-side release conversion).
  raw_jpeg_dir: null
pipeline:
  ctxid: 0
  imgsize: 224
  confthreshold: 0.85
  blurthreshold: 80.0
  min_similarity_raw: 0.40
  min_similarity_final: 0.45
  instantid:
    base_model: RunDiffusion/Juggernaut-XL-v9
    width: 1024
    height: 1024
    # guidance_scale, ip_adapter_scale, num_inference_steps default to null:
    # resolved from MODEL_DEFAULTS in generate_identities.py based on the
    # selected base_model.  Override via CLI to bypass presets (keys exist
    # in the schema so Hydra 1.3 accepts the override):
    #   pipeline.instantid.guidance_scale=4.0
    guidance_scale: null
    ip_adapter_scale: null
    num_inference_steps: null
    controlnet_conditioning_scale: 0.80
    cache_dir: null
    require_cuda: true

steps:
  download: true
  generate: true
  preprocess: true
  extract: true
  build: true
