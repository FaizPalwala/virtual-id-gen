    <script nonce="4bj6TDa5kj/nUzzhpF5VaQ==" type="application/ld+json">{"@context":"http://schema.org/","@type":"Dataset","name":"Synthetic Faces High Quality (SFHQ) part 1","description":"# Synthetic Faces High Quality (SFHQ) part 1\nThis dataset consists of 89,785 high quality 1024x1024 curated face images, and was created by \"bringing to life\" various art works (paintings, drawings, 3D models) using a process similar to what is described [in this short twitter thread](https://twitter.com/DavidBeniaguev/status/1376020024511627273?s=20&amp;t=kH9J5mV9hL8e3y8PruuB5Q) which involve encoding the images into StyleGAN2 latent space and performing a small manipulation that turns each image into a photo-realistic image.\n\nThe dataset also contains facial landmarks (extended set) and face parsing semantic segmentation maps. An example script is provided and demonstrates how to access landmarks, segmentation maps, and textually search withing the dataset (with CLIP image/text feature vectors), and also performs some exploratory analysis of the dataset. link to [github repo](https://github.com/SelfishGene/SFHQ-dataset) of the dataset.\n\nThe process that \"brings to life\" paintings and creates several candidate photo-realistic images is illustrated below:\n![](https://i.ibb.co/6sykFrj/Figure-1.jpg)\n\n## More Details\n1. The original inspiration images are taken from [Artstation-Artistic-face-HQ Dataset (AAHQ)](https://github.com/onion-liu/aahq-dataset) which contains mainly painting, drawing and 3D models of faces, [Close-Up Humans Dataset](https://opensynthetics.com/dataset/close-up-humans-dataset-by-synthesis-ai/) that contains 3D models of faces and [UIBVFED Dataset](http://ugivia.uib.es/uibvfed/) that also contain 3D models of faces.\n1. Each inspiration image was encoded by [encoder4editing (e4e)](https://github.com/omertov/encoder4editing) into [StyleGAN2](https://github.com/NVlabs/stylegan2-ada-pytorch) latent space (StyleGAN2 is a generative face model tained on [FFHQ dataset](https://github.com/NVlabs/ffhq-dataset)) and multiple candidate images were generated from each inspiration image\n1. These candidate images were then further curated and verified as being photo-realistic and high quality by a single human (me) and a machine learning assistant model that was trained to approximate my own human judgments and helped me scale myself to asses the quality of all images in the dataset\n1. Near duplicates and images that were too similar were removed using CLIP features (no two images in the dataset have CLIP similarity score of greater than ~0.92)\n1. From each image various pre-trained features were extracted and provided here for convenience, in particular CLIP features for fast textual query of the dataset\n1. From each image, semantic segmentation maps were extracted using [Face Parsing BiSeNet](https://github.com/zllrunning/face-parsing.PyTorch) and are provided in the dataset under \"segmentations\"\n1. From each image, an extended landmark set was extracted that also contain inner and outer hairlines (these are unique landmarks that are usually not extracted by other algorithms). These landmarks were extracted using [Dlib](https://github.com/davisking/dlib), [Face Alignment](https://github.com/1adrianb/face-alignment) and some post processing of [Face Parsing BiSeNet](https://github.com/zllrunning/face-parsing.PyTorch) and are provided in the dataset under \"landmarks\"\n1. NOTE: semantic segmentation and landmarks were first calculated on scaled down version of 256x256 images, and then upscaled to 1024x1024\n\n## Parts 1,2,3,4\n- [Part 1](https://www.kaggle.com/datasets/selfishgene/synthetic-faces-high-quality-sfhq-part-1) of the dataset consists of 89,785 HQ 1024x1024 curated face images. It uses \"inspiration\" images from [Artstation-Artistic-face-HQ dataset (AAHQ)](https://github.com/onion-liu/aahq-dataset), [Close-Up Humans dataset](https://opensynthetics.com/dataset/close-up-humans-dataset-by-synthesis-ai/) and [UIBVFED dataset](http://ugivia.uib.es/uibvfed/).  \n- [Part 2](https://www.kaggle.com/datasets/selfishgene/synthetic-faces-high-quality-sfhq-part-2) of the dataset consists of 91,361 HQ 1024x1024 curated face images. It uses \"inspiration\" images from [Face Synthetics dataset](https://github.com/microsoft/FaceSynthetics) and by sampling from the [Stable Diffusion v1.4](https://github.com/CompVis/stable-diffusion) text to image generator using varied face portrait prompts. \n- [Part 3](https://www.kaggle.com/datasets/selfishgene/synthetic-faces-high-quality-sfhq-part-3) of the dataset consists of 118,358 HQ 1024x1024 curated face images. It uses \"inspiration\" images by sampling from [StyleGAN2](https://github.com/NVlabs/stylegan2-ada-pytorch) mapping network with very high truncation psi coefficients to increase diversity of the generation. Here, the [e4e](https://github.com/omertov/encoder4editing) encoder is basically used a new kind of truncation trick.\n- [Part 4](https://www.kaggle.com/datasets/selfishgene/synthetic-faces-high-quality-sfhq-part-4) of the dataset consists of 125,754 HQ 1024x1024 cur...","url":"https://www.kaggle.com/selfishgene/synthetic-faces-high-quality-sfhq-part-1","version":4,"keywords":["data type, image","technique, deep learning","subject, arts and entertainment, art","audience, advanced","technique, neural networks, gan"],"license":{"@type":"CreativeWork","name":"CC0: Public Domain","url":"https://creativecommons.org/publicdomain/zero/1.0/"},"identifier":["2437902"],"includedInDataCatalog":{"@type":"DataCatalog","name":"Kaggle","url":"https://www.kaggle.com"},"creator":{"@type":"Person","name":"David Beniaguev","url":"https://www.kaggle.com/selfishgene","image":"https://storage.googleapis.com/kaggle-avatars/thumbnails/128750-kg.jpg"},"distribution":[{"@type":"DataDownload","requiresSubscription":true,"encodingFormat":"zip","fileFormat":"zip","contentUrl":"https://www.kaggle.com/datasets/selfishgene/synthetic-faces-high-quality-sfhq-part-1/download?datasetVersionNumber=4","contentSize":"14855578693 bytes"}],"commentCount":0,"dateModified":"2022-12-17T22:44:37.553Z","discussionUrl":"https://www.kaggle.com/selfishgene/synthetic-faces-high-quality-sfhq-part-1/discussion","alternateName":"90K curated 1024x1024 face images. StyleGAN2 encoding of paintings and 3D models","isAccessibleForFree":true,"thumbnailUrl":"https://storage.googleapis.com/kaggle-datasets-images/2437902/4127575/3667e4acd814c197fabfea9dfdb39a67/dataset-card.jpg?t=2022-12-17-22-37-26","interactionStatistic":[{"@type":"InteractionCounter","interactionType":"http://schema.org/CommentAction","userInteractionCount":0},{"@type":"InteractionCounter","interactionType":"http://schema.org/DownloadAction","userInteractionCount":5832},{"@type":"InteractionCounter","interactionType":"http://schema.org/ViewAction","userInteractionCount":14669},{"@type":"InteractionCounter","interactionType":"http://schema.org/LikeAction","userInteractionCount":19}]}</script>
