name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          # Minimal CPU-only subset — the suite's imports need numpy, pandas,
          # matplotlib, opencv (cv2), Pillow, pyarrow (parquet output).
          # torch/diffusers/insightface/onnxruntime-gpu are lazy imports in
          # the pipeline modules and NOT required by the tests.
          pip install "numpy>=1.24" "pandas>=2.0" "matplotlib>=3.7" \
                      "opencv-python>=4.8" "Pillow>=10.0" "pyarrow>=14.0" \
                      "pytest>=7.0"

      - name: Run test suite
        run: |
          pytest tests/ -v

      - name: Verify release schemas load
        run: |
          python -c "
          import json
          s = json.load(open('scripts/schema.json'))
          assert set(s['definitions']) == {'bench_balanced', 'bench_imbalanced', 'raw'}
          m = json.load(open('scripts/RELEASE_MANIFEST.json'))
          assert set(m['releases']) == {'bench', 'raw'}
          print('schemas OK')
          "
