[pytest]
testpaths = tests
pythonpath = src
# Disable hydra's pytest plugin — it breaks on Python 3.13 (dataclass slots
# incompatibility in hydra 1.3) and is only needed for testing hydra apps,
# which this suite does not do.  Keeps `pytest` working identically on
# macOS (ml_spec, py3.13) and Aire (data_gen, py3.10).
addopts = -p no:hydra_pytest
